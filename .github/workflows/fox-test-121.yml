name: Test OrangeFox 12.1 X625D (eksperimen ukuran)

# SEMENTARA: manual dispatch saja. Tidak membuat release, tidak menyentuh cache.
on:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
    - name: Checkout device tree
      uses: actions/checkout@v5
      with:
        path: device-tree

    - name: Free space (butuh ~45GB untuk manifest 12.1)
      run: |
        df -h
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost || true
        sudo apt-get clean
        df -h

    - name: Install deps (python3 untuk manifest 12.1, tanpa python2)
      run: |
        sudo apt-get update -y
        sudo apt-get install -y --no-install-recommends git python3 ccache \
          adb bc bison build-essential curl flex g++-multilib gcc-multilib gnupg gperf \
          imagemagick lib32readline-dev lib32z1-dev liblz4-tool libncurses-dev libsdl1.2-dev \
          libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools \
          xsltproc zip zlib1g-dev cpio
        mkdir -p ~/bin
        curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        echo "$HOME/bin" >> $GITHUB_PATH
        git config --global user.name "gh-action"
        git config --global user.email "gh-action@local"
        git config --global color.ui false

    - name: Sync OrangeFox 12.1 (minimal manifest)
      run: |
        git clone --depth=1 https://gitlab.com/OrangeFox/sync.git OrangeFox_sync
        chmod +x OrangeFox_sync/orangefox_sync.sh
        ./OrangeFox_sync/orangefox_sync.sh --branch 12.1 --path $GITHUB_WORKSPACE/fox121
        df -h

    - name: Copy device tree X625D
      run: |
        mkdir -p fox121/device/infinix/X625D
        cp -r device-tree/* fox121/device/infinix/X625D/
        ls fox121/device/infinix/X625D

    - name: Build recovery (test ukuran vs limit 32MB)
      working-directory: fox121
      run: |
        export LC_ALL=C
        export ALLOW_MISSING_DEPENDENCIES=true
        export FOX_BUILD_DEVICE=X625D
        source build/envsetup.sh
        lunch twrp_X625D-eng
        mka recoveryimage -j$(nproc --all) 2>&1 | tee $GITHUB_WORKSPACE/build-test.log
        echo "--- hasil ---"
        ls -lh out/target/product/X625D/*.img || true
        python3 -c "
        import glob, os
        lim = 33554432
        ok = True
        for p in glob.glob('out/target/product/X625D/*.img'):
            s = os.path.getsize(p)
            print('%s: %.1f MB %s' % (p, s/1048576, 'OK (muat 32MB)' if s <= lim else 'LEBIH! (over 32MB)'))
            ok = ok and s <= lim
        raise SystemExit(0 if ok else 0)
        "

    - name: Upload hasil test
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: OrangeFox-121-X625D-test
        path: |
          fox121/out/target/product/X625D/*.img
          build-test.log
