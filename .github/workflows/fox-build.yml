name: Build OrangeFox X625D

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout device tree
      uses: actions/checkout@v4
      with:
        path: device-tree

    - name: Free space
      run: |
        sudo apt-get clean
        df -h
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
        df -h

    - name: Setup Java 8 for Android 9
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '8'

    - name: Install deps
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y git python3 python-is-python3 android-tools-adb bc bison build-essential curl flex g++-multilib gcc-multilib gnupg gperf imagemagick lib32readline-dev lib32z1-dev liblz4-tool libncurses-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev cpio libtinfo5
        mkdir -p ~/bin
        curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        echo "$HOME/bin" >> $GITHUB_PATH
        git config --global user.name "gh-action"
        git config --global user.email "gh-action@local"
        git config --global color.ui false

    - name: Sync OrangeFox 11.0 (untuk Android 9)
      run: |
        git clone https://gitlab.com/OrangeFox/sync.git OrangeFox_sync
        cd OrangeFox_sync/sync
        ./orangefox_sync.sh --branch 11.0 --path $GITHUB_WORKSPACE/fox
        df -h

    - name: Copy device tree X625D
      run: |
        mkdir -p fox/device/infinix/X625D
        cp -r device-tree/* fox/device/infinix/X625D/
        ls -R fox/device/infinix/X625D | head -n 50
        ls -lh fox/device/infinix/X625D/prebuilt/

    - name: Build recovery
      working-directory: fox
      run: |
        source build/envsetup.sh
        lunch fox_X625D-eng
        mka recoveryimage -j$(nproc --all)
        ls -lh out/target/product/X625D/recovery.img
        echo "X625D OrangeFox unofficial $(date -u)" > out/target/product/X625D/build-info.txt

    - name: Upload recovery.img
      uses: actions/upload-artifact@v4
      with:
        name: OrangeFox-X625D-unofficial
        path: |
          fox/out/target/product/X625D/recovery.img
          fox/out/target/product/X625D/build-info.txt
