name: Build OrangeFox X625D

on:
  workflow_dispatch:
  release:
    types: [published]
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    # Auto-rilis: push biasa di-skip, kecuali pesan commit ada [release] / release:
    # Event manual (dispatch) & publish release selalu jalan.
    if: >-
      github.event_name != 'push' ||
      contains(join(github.event.commits.*.message, ' '), '[release]') ||
      contains(join(github.event.commits.*.message, ' '), 'release:')
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout device tree
      uses: actions/checkout@v4
      with:
        path: device-tree

    - name: Free space
      run: |
        sudo apt-get clean
        df -h
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
        df -h

    - name: Setup Java 8 for Android 9
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '8'

    - name: Cache APT packages (hemat ~3-5 mnt per run)
      uses: awalsh128/cache-apt-pkgs-action@v1
      with:
        packages: git python3 android-tools-adb bc bison build-essential curl flex g++-multilib gcc-multilib gnupg gperf imagemagick lib32readline-dev lib32z1-dev liblz4-tool libncurses-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev cpio ccache
        version: 1.0

    - name: Install deps (cepat, tanpa apt update ulang)
      run: |
        # Paket di atas sudah di-restore dari cache oleh step sebelumnya.
        # Step ini hanya handle yang TIDAK ada di repo jammy + setup cepat.
        # Ubuntu 22.04 tidak sedia libncurses5 -> ambil dari focal (dibutuhkan header-abi-dumper Android 9)
        if [ ! -f /lib/x86_64-linux-gnu/libncurses.so.5 ] && [ ! -f /usr/lib/x86_64-linux-gnu/libncurses.so.5 ]; then
          wget -q http://archive.ubuntu.com/ubuntu/pool/universe/n/ncurses/libtinfo5_6.2-0ubuntu2_amd64.deb -O /tmp/libtinfo5.deb
          wget -q http://archive.ubuntu.com/ubuntu/pool/universe/n/ncurses/libncurses5_6.2-0ubuntu2_amd64.deb -O /tmp/libncurses5.deb
          sudo dpkg -i /tmp/libtinfo5.deb /tmp/libncurses5.deb || sudo apt-get -f install -y
        fi
        ls -lh /lib/x86_64-linux-gnu/libncurses* /usr/lib/x86_64-linux-gnu/libncurses* || true
        # Android 9 wajib default python = python2 (check_radio_versions.py masih print tanpa kurung)
        # Ubuntu 22.04 tidak sedia python2 -> ambil dari repo focal (jammy sudah drop python2)
        if [ ! -x /usr/bin/python2 ] && [ ! -x /usr/bin/python2.7 ]; then
          echo "deb http://archive.ubuntu.com/ubuntu/ focal universe" | sudo tee /etc/apt/sources.list.d/focal-universe.list
          sudo apt-get update -o Dir::Etc::sourcelist="sources.list.d/focal-universe.list" -o Dir::Etc::sourceparts="-" -o APT::Get::List-Cleanup="0"
          sudo apt-get install -y --no-install-recommends python2 python2.7 python2.7-minimal libpython2.7-minimal libpython2.7-stdlib || sudo apt-get install -y python2.7
          sudo rm -f /etc/apt/sources.list.d/focal-universe.list
        fi
        sudo ln -sf /usr/bin/python2 /usr/bin/python || sudo ln -sf /usr/bin/python2.7 /usr/bin/python
        python --version
        python3 --version
        mkdir -p ~/bin
        if [ ! -x ~/bin/repo ]; then
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
        fi
        echo "$HOME/bin" >> $GITHUB_PATH
        git config --global user.name "gh-action"
        git config --global user.email "gh-action@local"
        git config --global color.ui false

    - name: Cache OrangeFox source (legacy 9.0, jarang update)
      # Source 9.0 legacy praktis beku -> cache direktori hasil sync agar
      # run berikutnya cukup `repo sync` inkremental (detik-menit, bukan
      # belasan menit download ulang). Naikkan suffix -vN di key kalau
      # mau paksa sync segar dari nol.
      uses: actions/cache@v4
      with:
        # JANGAN ikutkan fox/out (hasil build, GB-an, sudah di-cover ccache).
        # Tanpa exclude ini tar cache bikin disk runner penuh (zstd error 70).
        path: |
          fox
          !fox/out
        key: fox90-source-v2

    - name: Sync OrangeFox 9.0 legacy (untuk Android 9 X625D)
      run: |
        git clone --depth=1 https://gitlab.com/OrangeFox/sync.git OrangeFox_sync
        ls -la OrangeFox_sync/ OrangeFox_sync/legacy/patches/
        chmod +x OrangeFox_sync/legacy/orangefox_sync_legacy.sh
        # workaround: script legacy nyari patch di patches/, padahal patch 9.0 ada di legacy/patches/
        mkdir -p OrangeFox_sync/patches
        cp OrangeFox_sync/legacy/patches/patch-manifest-fox_9.0.diff OrangeFox_sync/patches/ || true
        cd OrangeFox_sync
        # cache fox/ dari run sebelumnya bisa korup (error: bootable/recovery/.git unsupported checkout state)
        # kalau .repo sudah ada, bersihkan state checkout dulu biar repo sync bisa --force-sync
        if [ -d "$GITHUB_WORKSPACE/fox/.repo" ]; then
          cd "$GITHUB_WORKSPACE/fox" || true
          repo forall -c 'git am --abort 2>/dev/null || true; git rebase --abort 2>/dev/null || true; git reset --hard 2>/dev/null || true; git clean -fdx 2>/dev/null || true' || true
          # hapus project yang paling sering korup (dari log kamu)
          rm -rf "$GITHUB_WORKSPACE/fox/bootable/recovery/.git" || true
          cd "$GITHUB_WORKSPACE/OrangeFox_sync" || cd OrangeFox_sync || true
          cd $GITHUB_WORKSPACE/OrangeFox_sync
        fi
        ./legacy/orangefox_sync_legacy.sh --branch 9.0 --path $GITHUB_WORKSPACE/fox || {
          echo "Sync pertama gagal, coba force-sync ulang..."
          cd $GITHUB_WORKSPACE/fox
          repo sync -j1 --fail-fast --force-sync bootable/recovery || rm -rf $GITHUB_WORKSPACE/fox/bootable/recovery
          cd $GITHUB_WORKSPACE/OrangeFox_sync
          ./legacy/orangefox_sync_legacy.sh --branch 9.0 --path $GITHUB_WORKSPACE/fox
        }
        df -h

    - name: Copy device tree X625D
      run: |
        mkdir -p fox/device/infinix/X625D
        cp -r device-tree/* fox/device/infinix/X625D/
        ls -R fox/device/infinix/X625D | head -n 50
        ls -lh fox/device/infinix/X625D/prebuilt/

    - name: Setup ccache (incremental, tidak pakai run_id)
      uses: hendrikmuhs/ccache-action@v1.2
      env:
        CCACHE_DIR: ${{ github.workspace }}/.ccache
      with:
        key: fox90-X625D
        restore-keys: fox90-X625D
        max-size: 5G

    - name: Build recovery
      working-directory: fox
      env:
        CCACHE_DIR: ${{ github.workspace }}/.ccache
      run: |
        export LC_ALL=C
        export ALLOW_MISSING_DEPENDENCIES=true
        export FOX_USE_TWRP_RECOVERY_IMAGE_BUILDER=1
        export FOX_BUILD_DEVICE=X625D
        export OF_USE_LZMA_COMPRESSION=1
        export FOX_DRASTIC_SIZE_REDUCTION=1
        export USE_CCACHE=1
        export CCACHE_EXEC=$(which ccache)
        ccache -z
        source build/envsetup.sh
        lunch omni_X625D-eng
        mka recoveryimage -j$(nproc --all)
        ccache -s
        ls -lh out/target/product/X625D/recovery.img
        echo "X625D OrangeFox unofficial $(date -u)" > out/target/product/X625D/build-info.txt
        # Info commit device-tree biar ketahuan img ini dari commit mana.
        # (device-tree di-checkout tanpa .git ikut ke-copy? .git TIDAK ikut `cp *`,
        # jadi baca git-nya langsung dari $GITHUB_WORKSPACE/device-tree.)
        DT_SHORT=$(git -C $GITHUB_WORKSPACE/device-tree rev-parse --short HEAD)
        DT_SHA=$(git -C $GITHUB_WORKSPACE/device-tree rev-parse HEAD)
        DT_MSG=$(git -C $GITHUB_WORKSPACE/device-tree log -1 --pretty=%s)
        echo "$DT_SHORT $DT_MSG" >> out/target/product/X625D/build-info.txt
        echo "$DT_SHA" >> out/target/product/X625D/build-info.txt
        echo "DT_SHORT=$DT_SHORT" >> $GITHUB_ENV
        cat out/target/product/X625D/build-info.txt

    - name: Upload recovery.img
      uses: actions/upload-artifact@v4
      with:
        name: OrangeFox-X625D-unofficial
        path: |
          fox/out/target/product/X625D/recovery.img
          fox/out/target/product/X625D/build-info.txt

    - name: Rename for release
      run: |
        if [ "${{ github.event_name }}" = "release" ]; then
          # Dipicu dari halaman Release -> pakai tag rilis itu, jangan bikin tag baru
          TAG="${{ github.event.release.tag_name }}"
        else
          TAG=$(date +'%Y%m%d%H%M')
        fi
        # Suffix commit biar jelas img ini dari commit mana: OrangeFox-X625D-<TAG>-<SHORT>.img
        SHORT="${DT_SHORT:-$(cd device-tree && git rev-parse --short HEAD)}"
        echo "TAG=$TAG" >> $GITHUB_ENV
        echo "FILENAME=OrangeFox-X625D-$TAG-$SHORT" >> $GITHUB_ENV
        cp fox/out/target/product/X625D/recovery.img OrangeFox-X625D-$TAG-$SHORT.img
        cp fox/out/target/product/X625D/build-info.txt build-info-$TAG-$SHORT.txt
        ls -lh OrangeFox-X625D-$TAG-$SHORT.img build-info-$TAG-$SHORT.txt
        cat build-info-$TAG-$SHORT.txt

    - name: Prepare release notes (branch + commit + link)
      run: |
        cd device-tree
        BRANCH="${GITHUB_REF_NAME}"
        # Saat dipicu event release, GITHUB_REF_NAME = tag, ambil branch dari payload bila ada
        if [ "${{ github.event_name }}" = "release" ]; then
          BRANCH="${{ github.event.release.target_commitish }}"
        fi
        SHA=$(git rev-parse HEAD)
        SHORT=$(git rev-parse --short HEAD)
        MSG=$(git log -1 --pretty=%s)
        REPO="${GITHUB_REPOSITORY}"
        echo "DT_BRANCH=$BRANCH" >> $GITHUB_ENV
        echo "DT_SHA=$SHA" >> $GITHUB_ENV
        echo "DT_SHORT=$SHORT" >> $GITHUB_ENV
        echo "Branch: $BRANCH @ $SHORT ($MSG)"
        # Kalau dipicu dari Release yang sudah ada -> ikuti flag prerelease-nya, jangan timpa
        if [ "${{ github.event_name }}" = "release" ]; then
          echo "IS_PRERELEASE=${{ github.event.release.prerelease }}" >> $GITHUB_ENV
          echo "Triggered by release -> keep prerelease=${{ github.event.release.prerelease }}"
        elif [ "${{ github.event_name }}" = "push" ]; then
          # Job push hanya jalan kalau commit ada [release] -> selalu stabil
          echo "IS_PRERELEASE=false" >> $GITHUB_ENV
          echo "Push with [release] -> stable release"
        elif echo "$MSG" | grep -iqE '\[release\]|release:'; then
          echo "IS_PRERELEASE=false" >> $GITHUB_ENV
          echo "Match [release] -> stable release"
        else
          echo "IS_PRERELEASE=true" >> $GITHUB_ENV
          echo "No [release] flag -> pre-release"
        fi
        cat > $GITHUB_WORKSPACE/release-notes.md <<EOF
        Unofficial Custom Recovery X625D auto-build ${{ env.TAG }}

        Device tree: [\`${BRANCH}\`](https://github.com/${REPO}/tree/${BRANCH}) — [\`${SHORT}\`](https://github.com/${REPO}/commit/${SHA}) ${MSG}
        EOF
        cat $GITHUB_WORKSPACE/release-notes.md

    - name: Release langsung
      if: github.event_name != 'release'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.TAG }}
        name: ${{ env.TAG }} ${{ env.DT_SHORT }}
        body_path: release-notes.md
        prerelease: ${{ env.IS_PRERELEASE }}
        files: |
          ${{ env.FILENAME }}.img
          build-info-${{ env.TAG }}-${{ env.DT_SHORT }}.txt
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload ke release pemicu (auto-build saat rilis)
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.event.release.tag_name }}
        files: |
          ${{ env.FILENAME }}.img
          build-info-${{ env.TAG }}-${{ env.DT_SHORT }}.txt
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
